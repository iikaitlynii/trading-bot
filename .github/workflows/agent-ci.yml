name: Agent PR quality checks

on:
  pull_request:
  push:
    branches: [main, master]
    paths:
      - 'paper_trader.py'
      - 'crypto_paper_trader.py'
      - 'strategy_comparison.py'
      - 'market_data.py'
      - 'paper_risk.py'
      - 'tests/**'
      - '.github/workflows/agent-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Python syntax
        run: python -m compileall -q paper_trader.py crypto_paper_trader.py strategy_comparison.py paper_risk.py tests
      - name: Run offline paper-trading regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify no live trading integrations were introduced
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          sources = [Path("paper_trader.py"), Path("crypto_paper_trader.py")]
          forbidden = [r"\bsubmit_order\s*\(", r"\bplace_order\s*\(", r"\bcreate_order\s*\(", r"\bapi_key\s*=", r"\bsecret_key\s*="]
          violations = [(str(p), pattern) for p in sources for pattern in forbidden if re.search(pattern, p.read_text())]
          if violations:
              raise SystemExit(f"Review live-order or credential patterns: {violations}")
          print("No known live-order patterns found in paper traders.")
          PY
