name: Stock Historical Research
on:
  workflow_dispatch:
  schedule:
    - cron: '40 23 * * 1-5'
permissions:
  contents: write
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect historical stock prices
        run: python stock_history_research.py
      - name: Commit research snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/stock_history.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update historical stock research"
            git pull --rebase
            git push
          fi
