name: Live Paper Trading

on:
  schedule:
    # Weekdays at 22:15 UTC, after the U.S. market close.
    - cron: '15 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run simulation-only paper trader
        run: python paper_trader.py

      - name: Build paper trading health report
        run: python paper_report.py

      - name: Save paper account state, journal, and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/state.json paper/journal.csv paper/latest_signals.csv paper/performance.csv paper/report.txt
          if git diff --cached --quiet; then
            echo "No paper-trading state changes to save."
          else
            git commit -m "Update live paper-trading state [skip ci]"
            git push
          fi
