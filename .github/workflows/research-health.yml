name: Research reliability health
on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * *'
  workflow_run:
    workflows: ['Live Paper Trading', 'Memecoin Paper Trading', 'Stock Historical Research', 'ETF Historical Research', 'Smart Money Research', 'Token Discovery Research', 'Simulated performance reports', 'Trading Bot Backtest']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: research-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check saved research and main workflow outcomes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m monitoring.health
      - name: Publish status indicators
        if: always()
        run: |
          if [ -f work/monitoring/health.md ]; then
            cat work/monitoring/health.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/monitoring/
          if-no-files-found: error
          retention-days: 30
