name: Agent PR quality checks

on:
  pull_request:
  push:
    branches: [main, master]
    paths:
      - 'paper_trader.py'
      - 'crypto_paper_trader.py'
      - 'strategy_comparison.py'
      - 'copilot/**'
      - 'research/copilot/**'
      - 'volume_profile.py'
      - 'research/volume_profile/**'
      - 'heikin_ashi_research.py'
      - 'research/heikin_ashi/**'
      - 'market_data.py'
      - 'monitoring/**'
      - 'data_contracts/**'
      - '.github/workflows/research-health.yml'
      - 'paper_risk.py'
      - 'performance_reports.py'
      - 'paper_report.py'
      - 'docs/**'
      - 'reports/**'
      - 'requirements.txt'
      - 'ROADMAP.md'
      - 'research/roadmap_evidence.json'
      - 'scripts/check_roadmap.py'
      - 'tests/**'
      - '.github/workflows/agent-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation-regression:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble@sha256:aa81288e738725378becba5b3e06cb0f3a7f012a610e87e8d767a090ea3f740d
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Python syntax
        run: python -m compileall -q copilot volume_profile.py paper_trader.py crypto_paper_trader.py strategy_comparison.py heikin_ashi_research.py paper_risk.py performance_reports.py paper_report.py monitoring data_contracts research/validation strategy_discovery scripts tests
      - name: Check roadmap completion evidence
        run: python scripts/check_roadmap.py
      - name: Check dashboard JavaScript syntax
        run: |
          node --check docs/dashboard.js
          node --check docs/performance_reports.js
          node --check docs/research_extensions.js
          node --check docs/strategy_discovery.js
          node --check docs/chart_intelligence.js
          node --check docs/video_discovery.js
          node --check docs/volume_profile.js
          node --check docs/copilot_engine.js
          node --check docs/copilot.js
      - name: Check saved dashboard report behavior
        run: |
          python tests/discovery_fixtures.py
          node tests/performance_dashboard_test.js
          node tests/discovery_dashboard_test.js
          node tests/chart_intelligence_test.js
          node tests/copilot_engine_test.js
      - name: Install browser check dependencies
        run: |
          python -m pip install -r tests/browser-requirements.txt
      - name: Check integrated dashboard in Chromium
        run: |
          python tests/dashboard_browser.py
          python tests/discovery_browser.py
          python tests/volume_profile_browser.py
          python tests/copilot_browser.py
      - name: Preserve synthetic Chromium screenshots and rendering diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/copilot-browser/
          retention-days: 7
          if-no-files-found: error
      - name: Run offline paper-trading regression tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s tests -v
      - name: Verify no live trading integrations were introduced
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          sources = [Path("paper_trader.py"), Path("crypto_paper_trader.py")]
          forbidden = [r"\bsubmit_order\s*\(", r"\bplace_order\s*\(", r"\bcreate_order\s*\(", r"\bapi_key\s*=", r"\bsecret_key\s*="]
          violations = [(str(p), pattern) for p in sources for pattern in forbidden if re.search(pattern, p.read_text())]
          if violations:
              raise SystemExit(f"Review live-order or credential patterns: {violations}")
          print("No known live-order patterns found in paper traders.")
          PY
