name: Simulated performance reports
on:
  workflow_dispatch:
  schedule:
    - cron: '50 23 * * *'
permissions:
  contents: write
concurrency:
  group: performance-reports
  cancel-in-progress: false
jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build reports from saved data only
        run: python performance_reports.py
      - name: Commit reporting outputs only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh simulated performance reports [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
