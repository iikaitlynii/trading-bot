name: Smart Money Research

on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public wallet activity (read-only)
        run: python solana_wallet_collector.py
      - name: Build research observations from public events
        run: python smart_money_observation_builder.py
      - name: Track forward outcomes (research only)
        run: python smart_money_outcome_tracker.py
      - name: Validate research data integrity
        run: python smart_money_integrity.py
      - name: Score research observations
        run: python smart_money_research.py
      - name: Update source reputation from 24h outcomes
        run: python smart_money_reputation_update.py
      - name: Build forward-tested wallet candidate metrics
        run: python smart_money_candidate_builder.py
      - name: Evaluate public wallet candidates
        run: python smart_money/candidate_evaluator.py
      - name: Compare paper signals with neutral control
        run: python smart_money_paper_comparison.py
      - name: Measure signal decay across checkpoints
        run: python smart_money_signal_decay.py
      - name: Build research health report
        run: python smart_money_health.py
      - name: Save research outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A smart_money/
          if git diff --cached --quiet; then
            echo "No smart-money research changes to save."
          else
            git commit -m "Update smart-money research data [skip ci]"
            git push
          fi
