name: Live Paper Trading

on:
  schedule:
    - cron: '15 22 * * 1-5'
  workflow_dispatch:

concurrency:
  group: validated-market-data-publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Capture account records before simulation
        run: python -m monitoring.account_health --capture stock
      - name: Validate and archive complete stock inputs
        run: python -m data_contracts.ingestion stock
      - name: Run simulation-only paper trader
        id: paper_simulation
        env:
          MARKET_DATA_MANIFEST: research/datasets/ingested/stock-latest.json
        run: python paper_trader.py
      - name: Analyze stock charts (research only)
        run: python chart_analysis.py
      - name: Track chart-analysis forward outcomes
        run: python chart_outcome_tracker.py
      - name: Evaluate chart scores against forward outcomes
        run: python chart_score_evaluation.py
      - name: Compare historical research signals (simulation only)
        run: python strategy_comparison.py
      - name: Record memecoin forward signal observations
        run: python memecoin_forward_research.py
      - name: Build paper trading health report
        run: python paper_report.py
      - name: Run parallel historical strategy research
        run: python research_lab.py
      - name: Advance true forward shadow accounts
        run: python forward_shadow.py
      - name: Save paper and research outputs even if a research step fails
        id: account_publication
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/datasets/ingested/
          git add -A paper/ research_lab/ crypto_paper/forward_signals.csv strategy_comparison_results.csv strategy_comparison_missing.csv
          if git diff --cached --quiet; then
            echo "No paper-trading or research-lab changes to save."
          else
            git commit -m "Update paper trading and forward research [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Export forward-only simulation accounting evidence
        if: always()
        run: |
          python -m simulation_v2.report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/simulation-v2/
          if [ -d simulation-v2 ]; then
            git add -A simulation-v2/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Publish forward-only simulation accounting evidence [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Record account publication evidence
        if: always()
        env:
          SIMULATION_OUTCOME: ${{ steps.paper_simulation.outcome }}
          ACCOUNT_PUBLICATION_OUTCOME: ${{ steps.account_publication.outcome }}
        run: |
          python -m monitoring.account_health --record stock --simulation "$SIMULATION_OUTCOME" --publication "$ACCOUNT_PUBLICATION_OUTCOME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A monitoring/account_receipts/ monitoring/ingestion/
          if ! git diff --cached --quiet; then
            git commit -m "Record stock account publication evidence [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Record ingestion and publication outcome
        if: always()
        env:
          PUBLICATION_OUTCOME: ${{ job.status }}
        run: |
          mkdir -p work/ingestion
          echo "Repository publication/job outcome: $PUBLICATION_OUTCOME" | tee work/ingestion/publication.txt >> "$GITHUB_STEP_SUMMARY"
          if [ -f work/ingestion/stock.json ]; then
            cat work/ingestion/stock.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingestion-stock-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/ingestion/
            research/datasets/ingested/
          if-no-files-found: error
